<script>
    const mainMusic   = document.getElementById('main__music');
    const letterMusic = document.getElementById('letter__music');
    const musicBtn    = document.getElementById('music__btn');
    const musicIcon   = musicBtn.querySelector('i');

    mainMusic.play().catch(e => console.log("Autoplay context setup"));

    function activateAudio() {
        if (mainMusic.muted) {
            mainMusic.muted = false;
            mainMusic.volume = 0.5;
            mainMusic.play().then(() => {
                musicIcon.className = 'fa-solid fa-pause';
            });
        }
    }

    window.addEventListener('click', activateAudio, { once: true });
    window.addEventListener('touchstart', activateAudio, { once: true });
    window.addEventListener('mousemove', activateAudio, { once: true });
    window.addEventListener('keydown', activateAudio, { once: true });

    musicBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        
        if(mainMusic.muted) {
            mainMusic.muted = false;
            mainMusic.volume = 0.5;
        }

        const active = !mainMusic.paused ? mainMusic : letterMusic;
        if (active.paused) {
            active.play();
            musicIcon.className = 'fa-solid fa-pause';
        } else {
            active.pause();
            musicIcon.className = 'fa-solid fa-music';
        }
    });

    let datetxt = "Eid Mubarak";
    let charArrDate = datetxt.split('');
    let currentIndex = 0;
    let date__of__birth = document.querySelector(".date__of__birth span");

    setTimeout(function () {
        date__of__birth.style.opacity = '1';
        let timeDatetxt = setInterval(function () {
            if (currentIndex < charArrDate.length) {
                date__of__birth.textContent += charArrDate[currentIndex];
                currentIndex++;
            } else {
                let i = document.createElement("i");
                i.className = "fa-solid fa-star";
                document.querySelector(".date__of__birth").prepend(i);
                document.querySelector(".date__of__birth").appendChild(i.cloneNode(true));
                clearInterval(timeDatetxt);
            }
        }, 120);
    }, 16500);

    let datatxtletter = "My love. You are a very special girl. I always silently thank you for coming into my life. Today, I wish you all the best, lots of health, and lots of joy. I always hope we will celebrate many more Eids like this together. Eid Mubarak to you.💕";
    let titleLetter = "To you";
    let charArrDateLetter = datatxtletter.split('');
    let charArrTitle = titleLetter.split('');
    let currentIndexLetter = 0;
    let currentIndexTitle = 0;
    let text__letter = document.querySelector(".text__letter p");

    var intervalContent;
    var intervalTitle;

    $("#btn__letter").on("click", function () {
        if(mainMusic.muted) { mainMusic.muted = false; }
        
        mainMusic.pause();
        mainMusic.currentTime = 0;
        letterMusic.volume = 0.5;
        letterMusic.play().then(() => {
            musicIcon.className = 'fa-solid fa-pause';
        });

        $(".box__letter").slideDown();
        setTimeout(function () { $(".letter__border").slideDown(); }, 1000);
        setTimeout(function () {
            intervalTitle = setInterval(function () {
                if (currentIndexTitle < charArrTitle.length) {
                    document.querySelector(".title__letter").textContent += charArrTitle[currentIndexTitle];
                    let i = document.createElement("i");
                    i.className = "fa-solid fa-heart";
                    document.querySelector(".title__letter").appendChild(i);
                    currentIndexTitle++;
                } else {
                    clearInterval(intervalTitle);
                }
            }, 100);
        }, 2000);
        setTimeout(function () {
            document.querySelector("#heart__letter").classList.add("animationOp");
            document.querySelector(".love__img").classList.add("animationOp");
            document.querySelector("#mewmew").classList.add("animationOp");
        }, 2800);
        setTimeout(function () {
            document.querySelectorAll(".heart").forEach((item) => {
                item.classList.add("animation");
            });
        }, 3500);
        setTimeout(function () {
            intervalContent = setInterval(function () {
                if (currentIndexLetter < charArrDateLetter.length) {
                    if(text__letter) text__letter.textContent += charArrDateLetter[currentIndexLetter];
                    currentIndexLetter++;
                } else {
                    clearInterval(intervalContent);
                }
            }, 50);
        }, 6000);
    });

    $(".close").on("click", function () {
        letterMusic.pause();
        letterMusic.currentTime = 0;
        mainMusic.play();
        musicIcon.className = 'fa-solid fa-pause';

        clearInterval(intervalContent);
        document.querySelector(".title__letter").textContent = "";
        if(text__letter) text__letter.textContent = "";
        currentIndexLetter = 0;
        currentIndexTitle = 0;
        document.querySelector("#heart__letter").classList.remove("animationOp");
        document.querySelector(".love__img").classList.remove("animationOp");
        document.querySelector("#mewmew").classList.remove("animationOp");
        document.querySelectorAll(".heart").forEach((item) => {
            item.classList.remove("animation");
        });
        $(".box__letter").slideUp();
        $(".letter__border").slideUp();
    });

    let mailBox  = document.querySelector('.mail');
    let boxmail  = document.querySelector('.boxMail');
    let closeBtn = document.querySelector('.fa-xmark');

    mailBox.onclick = function () {
        activateAudio();
        mailBox.classList.toggle('active');
        boxmail.classList.add('active');
    };

    closeBtn.addEventListener('click', function () {
        boxmail.classList.remove('active');
    });
</script>

</html>
