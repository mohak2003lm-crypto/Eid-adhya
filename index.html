<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nour Eid</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <style>
        .date__of__birth span {
            opacity: 0;
            transition: opacity 0.3s;
        }
        #music__btn {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.85);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        #music__btn:hover { transform: scale(1.1); }

        .boxMail.active {
            display: flex !important;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .boxMail-container {
            width: 100%;
            max-width: 90vw;
        }

        .card2 {
            max-height: 75vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* تنسيق الحزمة الجديدة */
        .money-stack { display: flex; flex-direction: column; align-items: center; margin: 20px auto; position: relative; }
        .stacked-img { width: 90%; max-width: 220px; height: auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); display: block; }
        .stacked-img:nth-child(2) { margin-top: -80px; z-index: -1; }
    </style>
</head>

<body>

    <audio id="main__music" loop muted>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
    <audio id="letter__music" loop>
        <source src="music_letter.mp3" type="audio/mpeg">
    </audio>

    <button id="music__btn" title="Toggle Music">
        <i class="fa-solid fa-play"></i>
    </button>

    <div id="wrapper">
        <div class="flag__birthday">
            <img src="./images/1.png" alt="" width="350" class="flag__left">
            <img src="./images/1.png" alt="" width="350" class="flag__right">
        </div>
        <div class="content">
            <div class="left">
                <div class="title">
                    <h1 class="happy">
                        <span style="--t: 4s;">H</span>
                        <span style="--t: 4.2s;">a</span>
                        <span style="--t: 4.4s;">p</span>
                        <span style="--t: 4.6s;">p</span>
                        <span style="--t: 4.8s;">y</span>
                        <span style="--t: 5s;">&nbsp;</span>
                        <span style="--t: 5.2s;">E</span>
                        <span style="--t: 5.4s;">i</span>
                        <span style="--t: 5.6s;">d</span>
                    </h1>
                    <h1 class="birthday">
                        <span style="--t: 6s;">N</span>
                        <span style="--t: 6.2s;">o</span>
                        <span style="--t: 6.4s;">u</span>
                        <span style="--t: 6.6s;">r</span>
                        <span style="--t: 6.8s;">r</span>
                        <span style="--t: 7s;">a</span>
                    </h1>
                    <div class="hat">
                        <img src="./images/hat.png" alt="" width="130">
                    </div>
                </div>
                <div class="date__of__birth">
                    <span></span>
                </div>
                <div class="btn">
                    <button id="btn__letter">
                        <div class="mail">
                            Collect Money
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                    </button>
                </div>
            </div>
            <div class="right">
                <div class="box__account">
                    <div class="image">
                        <img src="./images/named.png" alt="">
                    </div>
                    <div class="name">
                        <i class="fa-solid fa-heart"></i>
                        <span>Dear Nourra</span>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="balloon_one">
                        <img width="100px" src="./images/balloon1.png" alt="">
                    </div>
                    <div class="balloon_two">
                        <img width="100px" src="./images/balloon2.png" alt="">
                    </div>
                </div>
                <div class="cricle">
                    <div class="text__cricle">
                        <span style="--i: 1;">E</span>
                        <span style="--i: 2;">i</span>
                        <span style="--i: 3;">d</span>
                        <span style="--i: 4;">-</span>
                        <span style="--i: 5;">M</span>
                        <span style="--i: 6;">u</span>
                        <span style="--i: 7;">b</span>
                        <span style="--i: 8;">a</span>
                        <span style="--i: 9;">r</span>
                        <span style="--i: 10;">a</span>
                        <span style="--i: 11;">k</span>
                        <span style="--i: 12;">-</span>
                    </div>
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>
        </div>
        
        <div class="boxMail">
            <i class="fa-solid fa-xmark"></i>
            <div class="boxMail-container">
                <div class="card1" style="position: relative; overflow: visible;">
                    <div class="userImg">
                        <img src="images/named.png" alt="">
                    </div>
                    <h4 class="username">To: Nourra 💖<span class="underline"></span></h4>
                    <h3>Happy Eid</h3>
                </div>
                <div class="card2">
                    <div class="card2-content">
                        <h3>Eid Mubarak!</h3>
                        <div class="money-stack">
                            <img src="money.png" alt="Money" class="stacked-img">
                            <img src="money.png" alt="Money" class="stacked-img">
                        </div>
                        <div class="imageCute2">
                            <img src="cute2.png" alt="">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    // تم التعديل في الـ HTML أعلاه، لا حاجة لتعديل السكربت لأنه يعتمد على محتويات الـ HTML.
</script>
</html>
